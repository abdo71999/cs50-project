{% extends "layout.html" %}

{% block title %}Create account{% endblock %}

{% block body %}
<main class="container page-shell py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <span class="badge text-bg-primary mb-3">Physics Data Lab</span>
                    <h1 class="card-title mb-2">Create your account</h1>
                    <p class="text-secondary mb-4">
                        Save your regression analyses and return to them later.
                    </p>

                    <form action="{{ url_for('register') }}" method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label" for="user_name">Username</label>
                            <input
                                class="form-control"
                                id="user_name"
                                name="user_name"
                                type="text"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <input
                                class="form-control"
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="new-password"
                                required
                            >
                        </div>

                        <button class="btn btn-primary" type="submit">Create account</button>
                        <a class="btn btn-outline-secondary ms-2" href="{{ url_for('index') }}">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
