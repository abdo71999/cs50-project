{% extends "layout.html" %}

{% block title %}Sign in{% endblock %}

{% block body %}
<main class="container page-shell py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <span class="badge text-bg-primary mb-3">Physics Data Lab</span>
                    <h1 class="card-title mb-2">Welcome back</h1>
                    <p class="text-secondary mb-4">
                        Sign in to access your saved regression analyses.
                    </p>

                    <form action="{{ url_for('login') }}" method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label" for="user_name">Username</label>
                            <input
                                class="form-control"
                                id="user_name"
                                name="user_name"
                                type="text"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <input
                                class="form-control"
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="current-password"
                                required
                            >
                        </div>

                        <button class="btn btn-primary" type="submit">Sign in</button>
                    </form>

                    <p class="text-secondary mt-4 mb-0">
                        New to Physics Data Lab?
                        <a href="{{ url_for('register') }}">Create an account</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
