{% extends "layout.html" %}

{% block title%} Upload {%endblock%}

{% block body %}

    <main class="container page-shell py-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <span class="badge text-bg-primary mb-3">Physics Data Lab</span>
                <h1 class="card-title">Upload your dataset</h1>
                <p class="card-text text-secondary mb-4">
                    Upload a CSV file to begin a linear regression analysis.
                </p>
                <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <label class="form-label" for="dataset">CSV dataset</label>
                    <input class="form-control mb-3" id="dataset" type="file" name="dataset" accept=".csv" required>
                    <button class="btn btn-primary" type="submit">Upload dataset</button>
                </form>
            </div>
        </div>
    </main>

{% endblock body %}
